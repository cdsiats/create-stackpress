name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check release metadata
        run: npm run release:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Packaged CLI smoke
        run: node --import tsx --test tests/smoke/cli-package.test.ts
        env:
          # Node 22 runs the opt-in heavy smoke on every OS: install the packed
          # tarball and install/build a generated project. Node 24 stays light.
          CREATE_STACKPRESS_SMOKE: ${{ matrix.node == 22 && '1' || '0' }}
